[workspace]
members = [
    "crates/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["NES Emulator Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
bitflags = "2.4"
wasm-bindgen = "0.2"
nes-core = { path = "crates/nes-core" }
