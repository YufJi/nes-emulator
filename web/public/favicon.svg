<!--
  A ROM cartridge on the island's green card: the cartridge is what this app
  loads, saves and switches, so it says "NES" where a generic play button does
  not. Drawn on a 16x16 pixel grid (`scale(4)`) in the palette of the UI — that
  grid is what keeps it crisp when a tab renders it at 16 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NES Emulator">
  <rect width="64" height="64" rx="8" fill="#8ac68a" />
  <g transform="scale(4)">
    <!-- shell -->
    <rect x="4" y="2" width="8" height="12" fill="#f7f3df" />
    <!-- shadowed top edge, so the shell reads as a solid object -->
    <rect x="4" y="2" width="8" height="1" fill="#3d3428" />
    <!-- sticker -->
    <rect x="5" y="4" width="6" height="5" fill="#725d42" />
    <rect x="6" y="6" width="4" height="1" fill="#f7f3df" />
    <rect x="7" y="7" width="2" height="1" fill="#f7f3df" />
    <!-- edge connector -->
    <rect x="4" y="11" width="1" height="1" fill="#725d42" />
    <rect x="6" y="11" width="1" height="1" fill="#725d42" />
    <rect x="8" y="11" width="1" height="1" fill="#725d42" />
    <rect x="10" y="11" width="1" height="1" fill="#725d42" />
    <rect x="5" y="12" width="6" height="1" fill="#725d42" />
  </g>
</svg>
