<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
</head>
<body>
    <h1>Console Test</h1>
    <input type="file" id="rom-file" accept=".nes" />
    <div id="status">Loading...</div>
    <script type="module">
        import init, { JsNes } from './pkg/nes_wasm.js';
        
        async function main() {
            try {
                console.log("Starting init...");
                await init();
                console.log("Init complete!");
                
                const status = document.getElementById('status');
                status.textContent = "Ready!";
                
                document.getElementById('rom-file').addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    console.log("Loading file:", file.name);
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const uint8Array = new Uint8Array(arrayBuffer);
                        console.log("File size:", uint8Array.length);
                        
                        const nes = new JsNes();
                        console.log("JsNes created");
                        
                        nes.load_rom(uint8Array);
                        console.log("ROM loaded successfully!");
                        
                        status.textContent = "ROM loaded: " + file.name;
                        
                        // Try running one frame
                        nes.frame();
                        console.log("Frame executed");
                        
                        const frameBuffer = nes.get_frame_buffer();
                        console.log("Frame buffer size:", frameBuffer.length);
                        console.log("First 10 pixels:", frameBuffer.slice(0, 10));
                        
                    } catch (err) {
                        console.error("Error:", err);
                        status.textContent = "Error: " + err.message;
                    }
                });
                
            } catch (err) {
                console.error("Init failed:", err);
                document.getElementById('status').textContent = "Init failed: " + err.message;
            }
        }
        
        main();
    </script>
</body>
</html>
