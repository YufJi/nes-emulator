<!DOCTYPE html>
<html>
<head>
    <title>Debug3</title>
    <style>
        body { font-family: monospace; padding: 10px; }
        #canvas { border: 2px solid #333; image-rendering: pixelated; width: 512px; height: 480px; }
        #log { background: #000; color: #0f0; padding: 10px; height: 150px; overflow-y: scroll; margin-top: 10px; font-size: 12px;}
        .info { color: #0ff; }
        .error { color: #f00; }
        .warn { color: #ff0; }
        #stats { background: #222; color: #fff; padding: 10px; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Debug NES (detailed)</h1>
    <canvas id="canvas" width="256" height="240"></canvas>
    <div id="stats">No ROM loaded</div>
    <input type="file" id="file" accept=".nes">
    <button id="step" disabled>Step 1 Frame</button>
    <button id="run" disabled>Run</button>
    <div id="log"></div>
    <script type="module">
        import init, { JsNes } from './pkg/nes_wasm.js';
        
        const log = (msg, cls='') => {
            const el = document.getElementById('log');
            const time = new Date().toLocaleTimeString().split(' ')[0];
            el.innerHTML += `<div class="${cls}">[${time}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        };
        
        let nes = null;
        let running = false;
        let frameCount = 0;
        
        async function main() {
            await init();
            log("WASM ready");
            
            document.getElementById('file').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                log(`Loading ${file.name}...`);
                const buf = await file.arrayBuffer();
                const rom = new Uint8Array(buf);
                
                // Check header
                const header = rom.slice(0, 16);
                const magic = String.fromCharCode(...header.slice(0, 4));
                const prgSize = header[4] * 16;
                const chrSize = header[5] * 8;
                const mapper = ((header[7] & 0xF0) | (header[6] >> 4));
                
                log(`Magic: ${magic}`, "info");
                log(`PRG: ${prgSize}KB, CHR: ${chrSize}KB, Mapper: ${mapper}`, "info");
                
                if (nes) nes.free();
                nes = new JsNes();
                
                try {
                    nes.load_rom(rom);
                    log("ROM loaded successfully", "info");
                    frameCount = 0;
                    document.getElementById('step').disabled = false;
                    document.getElementById('run').disabled = false;
                    
                    // Run first frame
                    doFrame();
                    
                } catch (err) {
                    log(`Error: ${err.message}`, "error");
                    console.error(err);
                }
            });
            
            document.getElementById('step').addEventListener('click', doFrame);
            
            document.getElementById('run').addEventListener('click', () => {
                running = !running;
                document.getElementById('run').textContent = running ? "Pause" : "Run";
                if (running) runLoop();
            });
        }
        
        function doFrame() {
            if (!nes) return;
            
            try {
                nes.frame();
                frameCount++;
                
                // Render
                const fb = nes.get_frame_buffer();
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                const img = ctx.createImageData(256, 240);
                
                for (let i = 0, j = 0; i < fb.length; i++, j += 4) {
                    const p = fb[i];
                    img.data[j] = (p >> 16) & 0xFF;
                    img.data[j+1] = (p >> 8) & 0xFF;
                    img.data[j+2] = p & 0xFF;
                    img.data[j+3] = (p >> 24) & 0xFF;
                }
                ctx.putImageData(img, 0, 0);
                
                // Analyze frame
                const stats = analyzeFrame(fb);
                document.getElementById('stats').innerHTML = 
                    `Frame: ${frameCount}<br>` +
                    `Unique colors: ${stats.uniqueColors}<br>` +
                    `Dominant: 0x${stats.dominant.toString(16).padStart(8, '0')}<br>` +
                    `Non-black: ${stats.nonBlack} pixels`;
                
                if (frameCount <= 5 || frameCount % 60 === 0) {
                    log(`Frame ${frameCount}: ${stats.uniqueColors} colors, dominant=0x${stats.dominant.toString(16)}`);
                }
                
            } catch (err) {
                log(`Error: ${err.message}`, "error");
                console.error(err);
                running = false;
            }
        }
        
        function runLoop() {
            if (!running) return;
            doFrame();
            requestAnimationFrame(runLoop);
        }
        
        function analyzeFrame(fb) {
            const colors = new Set();
            let nonBlack = 0;
            const colorCounts = {};
            
            for (const pixel of fb) {
                colors.add(pixel);
                colorCounts[pixel] = (colorCounts[pixel] || 0) + 1;
                if (pixel !== 0xFF000000) nonBlack++;
            }
            
            let dominant = 0;
            let maxCount = 0;
            for (const [color, count] of Object.entries(colorCounts)) {
                if (count > maxCount) {
                    maxCount = count;
                    dominant = parseInt(color);
                }
            }
            
            return {
                uniqueColors: colors.size,
                dominant,
                nonBlack
            };
        }
        
        main();
    </script>
</body>
</html>
