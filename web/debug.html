<!DOCTYPE html>
<html>
<head>
    <title>Debug NES</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #log { background: #000; color: #0f0; padding: 10px; height: 400px; overflow-y: scroll; white-space: pre-wrap; }
        .error { color: #f00; }
        .info { color: #0ff; }
    </style>
</head>
<body>
    <h1>NES Debugger</h1>
    <input type="file" id="rom-file" accept=".nes" />
    <button id="step-btn" disabled>Step Frame</button>
    <div id="log"></div>
    <script type="module">
        import init, { JsNes } from './pkg/nes_wasm.js';
        
        const log = (msg, cls = '') => {
            const el = document.getElementById('log');
            el.innerHTML += `<div class="${cls}">${msg}</div>`;
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        };
        
        let nes = null;
        
        async function main() {
            try {
                log("Initializing WASM...");
                await init();
                log("WASM initialized!", "info");
                
                document.getElementById('rom-file').addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    log(`Loading ROM: ${file.name}`);
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const uint8Array = new Uint8Array(arrayBuffer);
                        log(`File size: ${uint8Array.length} bytes`);
                        
                        // Check iNES header
                        const header = new Uint8Array(arrayBuffer.slice(0, 16));
                        const magic = String.fromCharCode(...header.slice(0, 4));
                        log(`Magic: ${magic}`);
                        log(`PRG ROM: ${header[4] * 16}KB`);
                        log(`CHR ROM: ${header[5] * 8}KB`);
                        log(`Mapper: ${((header[7] & 0xF0) | (header[6] >> 4))}`);
                        
                        if (nes) {
                            log("Freeing old instance...");
                            nes.free();
                        }
                        
                        log("Creating JsNes instance...");
                        nes = new JsNes();
                        log("Instance created");
                        
                        log("Loading ROM into emulator...");
                        nes.load_rom(uint8Array);
                        log("ROM loaded successfully!", "info");
                        
                        document.getElementById('step-btn').disabled = false;
                        
                    } catch (err) {
                        log(`Error: ${err.message}`, "error");
                        console.error(err);
                    }
                });
                
                document.getElementById('step-btn').addEventListener('click', () => {
                    if (!nes) return;
                    try {
                        log("Executing frame...");
                        nes.frame();
                        log("Frame executed");
                        
                        const fb = nes.get_frame_buffer();
                        log(`Frame buffer: ${fb.length} pixels`);
                        
                        // Check if frame is not all black
                        let nonBlack = 0;
                        for (let i = 0; i < Math.min(fb.length, 1000); i++) {
                            if (fb[i] !== 0xFF000000) nonBlack++;
                        }
                        log(`Non-black pixels in first 1000: ${nonBlack}`);
                        
                    } catch (err) {
                        log(`Frame error: ${err.message}`, "error");
                        console.error(err);
                    }
                });
                
            } catch (err) {
                log(`Init failed: ${err.message}`, "error");
                console.error(err);
            }
        }
        
        main();
    </script>
</body>
</html>
