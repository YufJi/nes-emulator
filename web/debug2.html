<!DOCTYPE html>
<html>
<head>
    <title>Debug2</title>
    <style>
        body { font-family: monospace; padding: 10px; }
        #canvas { border: 2px solid #333; }
        #log { background: #000; color: #0f0; padding: 10px; height: 200px; overflow-y: scroll; margin-top: 10px; }
        .info { color: #0ff; }
        .error { color: #f00; }
    </style>
</head>
<body>
    <h1>Debug NES (with PPUMASK logging)</h1>
    <canvas id="canvas" width="256" height="240"></canvas>
    <br>
    <input type="file" id="file" accept=".nes">
    <button id="pause" disabled>Pause</button>
    <div id="log"></div>
    <script type="module">
        import init, { JsNes } from './pkg/nes_wasm.js';
        
        const log = (msg, cls='') => {
            const el = document.getElementById('log');
            el.innerHTML += `<div class="${cls}">[${Date.now()%10000}] ${msg}</div>`;
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        };
        
        let nes = null;
        let running = false;
        let frameCount = 0;
        
        async function main() {
            await init();
            log("WASM ready");
            
            document.getElementById('file').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                log(`Loading ${file.name}...`);
                const buf = await file.arrayBuffer();
                const rom = new Uint8Array(buf);
                
                if (nes) nes.free();
                nes = new JsNes();
                
                try {
                    nes.load_rom(rom);
                    log("ROM loaded, starting emulation...", "info");
                    running = true;
                    frameCount = 0;
                    document.getElementById('pause').disabled = false;
                    requestAnimationFrame(loop);
                } catch (err) {
                    log(`Error: ${err.message}`, "error");
                }
            });
            
            document.getElementById('pause').addEventListener('click', () => {
                running = !running;
                document.getElementById('pause').textContent = running ? "Pause" : "Resume";
                if (running) requestAnimationFrame(loop);
            });
        }
        
        function loop() {
            if (!running || !nes) return;
            
            try {
                nes.frame();
                frameCount++;
                
                // Render to canvas
                const fb = nes.get_frame_buffer();
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                const img = ctx.createImageData(256, 240);
                
                for (let i = 0, j = 0; i < fb.length; i++, j += 4) {
                    const p = fb[i];
                    img.data[j] = (p >> 16) & 0xFF;
                    img.data[j+1] = (p >> 8) & 0xFF;
                    img.data[j+2] = p & 0xFF;
                    img.data[j+3] = (p >> 24) & 0xFF;
                }
                ctx.putImageData(img, 0, 0);
                
                // Log every 60 frames
                if (frameCount % 60 === 0) {
                    // Check if frame is all same color
                    const firstPixel = fb[0];
                    let allSame = true;
                    for (let i = 1; i < Math.min(fb.length, 100); i++) {
                        if (fb[i] !== firstPixel) {
                            allSame = false;
                            break;
                        }
                    }
                    log(`Frame ${frameCount}: first pixel=0x${firstPixel.toString(16)}, all same=${allSame}`);
                }
                
            } catch (err) {
                log(`Frame error: ${err.message}`, "error");
                running = false;
            }
            
            requestAnimationFrame(loop);
        }
        
        main();
    </script>
</body>
</html>
