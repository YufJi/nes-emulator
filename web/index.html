<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>NES Emulator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: #1a1a2e;
        color: #eee;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      
      h1 {
        margin-bottom: 20px;
        color: #e94560;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      }
      
      #game-container {
        position: relative;
        margin-bottom: 20px;
        border: 4px solid #16213e;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      }
      
      #nes-canvas {
        display: block;
        background: #000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }
      
      button {
        padding: 10px 20px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        background: #e94560;
        color: white;
        cursor: pointer;
        transition: background 0.2s;
      }
      
      button:hover {
        background: #c73e54;
      }
      
      button:disabled {
        background: #555;
        cursor: not-allowed;
      }
      
      input[type="file"] {
        display: none;
      }
      
      .file-label {
        padding: 10px 20px;
        font-size: 14px;
        border-radius: 4px;
        background: #0f3460;
        color: white;
        cursor: pointer;
        transition: background 0.2s;
      }
      
      .file-label:hover {
        background: #1a4a7a;
      }
      
      .instructions {
        background: #16213e;
        padding: 20px;
        border-radius: 8px;
        max-width: 600px;
        text-align: center;
      }
      
      .instructions h2 {
        color: #e94560;
        margin-bottom: 15px;
      }
      
      .controls-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        text-align: left;
        margin-top: 10px;
      }
      
      .control-item {
        display: flex;
        justify-content: space-between;
        padding: 5px 10px;
        background: #0f3460;
        border-radius: 4px;
      }
      
      .key {
        color: #e94560;
        font-weight: bold;
      }
      
      #status {
        margin-top: 10px;
        padding: 10px;
        background: #0f3460;
        border-radius: 4px;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .loading {
        color: #aaa;
      }
      
      .error {
        color: #e94560;
      }
      
      .success {
        color: #4ecca3;
      }
    </style>
  </head>
  <body>
    <h1>NES Emulator</h1>
    
    <div id="game-container">
      <canvas id="nes-canvas" width="512" height="480"></canvas>
    </div>
    
    <div class="controls">
      <label for="rom-file" class="file-label">Load ROM</label>
      <input type="file" id="rom-file" accept=".nes" />
      <button id="reset-btn" disabled>Reset</button>
      <button id="pause-btn" disabled>Pause</button>
    </div>
    
    <div id="status" class="loading">Loading WASM module...</div>
    
    <div class="instructions">
      <h2>Controls</h2>
      <div class="controls-grid">
        <div class="control-item"><span>Up</span><span class="key">↑</span></div>
        <div class="control-item"><span>A Button</span><span class="key">X</span></div>
        <div class="control-item"><span>Down</span><span class="key">↓</span></div>
        <div class="control-item"><span>B Button</span><span class="key">Z</span></div>
        <div class="control-item"><span>Left</span><span class="key">←</span></div>
        <div class="control-item"><span>Start</span><span class="key">Enter</span></div>
        <div class="control-item"><span>Right</span><span class="key">→</span></div>
        <div class="control-item"><span>Select</span><span class="key">Shift</span></div>
      </div>
    </div>
    
    <script type="module" src="./index.js"></script>
  </body>
</html>
