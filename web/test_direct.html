<!DOCTYPE html>
<html>
<head>
    <title>Direct Test</title>
    <style>
        body { font-family: monospace; padding: 10px; }
        canvas { border: 2px solid #333; }
        #info { background: #222; color: #0f0; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Direct VRAM Test</h1>
    <canvas id="c" width="256" height="240"></canvas>
    <div id="info">Loading...</div>
    <script type="module">
        import init, { JsNes } from './pkg/nes_wasm.js';
        
        const info = document.getElementById('info');
        const ctx = document.getElementById('c').getContext('2d');
        
        async function main() {
            await init();
            info.textContent = "Creating NES instance...";
            
            const nes = new JsNes();
            
            // Create a minimal ROM that just loops
            const rom = new Uint8Array([
                // iNES header
                0x4E, 0x45, 0x53, 0x1A,
                0x01, // 16KB PRG
                0x01, // 8KB CHR
                0x00, 0x00,
                0x00, 0x00, 0x00, 0x00,
                0x00, 0x00, 0x00, 0x00,
                
                // PRG-ROM (16KB)
                // Just infinite loop at $8000
                0x4C, 0x00, 0x80, // JMP $8000
                ...new Array(16384 - 3).fill(0xEA),
                
                // Reset vector at $FFFC
                0x00, 0x80,
                0x00, 0x80,
                
                // CHR-ROM (8KB) - some pattern data
                ...new Array(8192).fill(0xFF),
            ]);
            
            info.textContent = "Loading ROM...";
            nes.load_rom(rom);
            
            info.textContent = "Running 1 frame...";
            nes.frame();
            
            // Get frame buffer
            const fb = nes.get_frame_buffer();
            
            // Check first few pixels
            const firstPixels = Array.from(fb.slice(0, 10)).map(p => '0x' + p.toString(16));
            
            // Count unique colors
            const uniqueColors = new Set(fb);
            
            info.innerHTML = `First 10 pixels: ${firstPixels.join(', ')}<br>Unique colors: ${uniqueColors.size}`;
            
            // Render
            const img = ctx.createImageData(256, 240);
            for (let i = 0, j = 0; i < fb.length; i++, j += 4) {
                const p = fb[i];
                img.data[j] = (p >> 16) & 0xFF;
                img.data[j+1] = (p >> 8) & 0xFF;
                img.data[j+2] = p & 0xFF;
                img.data[j+3] = (p >> 24) & 0xFF;
            }
            ctx.putImageData(img, 0, 0);
        }
        
        main().catch(err => {
            info.textContent = "Error: " + err.message;
            console.error(err);
        });
    </script>
</body>
</html>
